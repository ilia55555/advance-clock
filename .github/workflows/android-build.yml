name: Android Build

on:
  push:
    branches:
      - Ilia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate localization resources
        run: python3 tools/generate_localizations.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit generated localization files
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- 'app/src/main/res/values*/localization_full.xml')" ]; then
            echo "Localization files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values*/localization_full.xml
          git commit -m "Generate complete localization resources [skip ci]"
          git push origin HEAD:Ilia
