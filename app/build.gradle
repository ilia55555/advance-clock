plugins {
    id 'com.android.application'
}

def localizationResourceFiles = [
        'values', 'values-ar', 'values-de', 'values-en', 'values-es', 'values-fa',
        'values-fr', 'values-hi', 'values-ja', 'values-pt', 'values-ru', 'values-tr',
        'values-zh-rCN'
].collect { file("src/main/res/${it}/strings.xml") }

// Every locale is maintained in one strings.xml file. Keep this compatibility task so old
// Android Studio run configurations can verify the central locale files.
tasks.register('generateLocalizations') {
    group = 'build setup'
    description = 'Verifies the localization XML files committed under src/main/res.'
    inputs.files(localizationResourceFiles)
    doLast {
        def missingFiles = localizationResourceFiles.findAll { !it.isFile() }
        if (!missingFiles.isEmpty()) {
            throw new GradleException('Missing committed localization resources: '
                    + missingFiles.join(', '))
        }
        logger.lifecycle('All committed localization resources are present.')
    }
}

// The owner imports app icons manually via Android Studio > New > Image Asset.
// Do not generate or commit those images: use them only when present locally.
// A clean GitHub checkout falls back to the built-in Android application icon.
def hasLocalLauncherIcon = { String iconName ->
    fileTree(dir: 'src/main/res', includes: [
            "mipmap*/${iconName}.xml",
            "mipmap*/${iconName}.png",
            "mipmap*/${iconName}.webp"
    ]).files.any { it.isFile() }
}
def hasLocalLauncher = hasLocalLauncherIcon('ic_launcher')
def hasLocalRoundLauncher = hasLocalLauncherIcon('ic_launcher_round')

android {
    namespace 'com.ilia.advanceclock'

    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.ilia.advanceclock'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.0.4'

        // All launcher artwork is untracked and owner-managed on this computer.
        manifestPlaceholders = [
                launcherIconResource: hasLocalLauncher
                        ? '@mipmap/ic_launcher' : '@android:drawable/sym_def_app_icon',
                launcherRoundIconResource: hasLocalRoundLauncher
                        ? '@mipmap/ic_launcher_round'
                        : (hasLocalLauncher ? '@mipmap/ic_launcher' : '@android:drawable/sym_def_app_icon')
        ]
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = "2g"
            testLogging { exceptionFormat = "full" }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateLocalizations')
}

// Exercise the production adapter on JVM ICU without executing Android stub methods.
// Only the ICU import and class name differ; the adapter logic is generated verbatim.
def calendarAdapterOutput = layout.buildDirectory.dir('generated/calendarTest')
def generateJvmCalendarAdapter = tasks.register('generateJvmCalendarAdapter') {
    def source = file('src/main/java/com/ilia/advanceclock/PinnedCalendar.java')
    inputs.file(source)
    outputs.dir(calendarAdapterOutput)
    doLast {
        def target = calendarAdapterOutput.get().file('com/ilia/advanceclock/JvmPinnedCalendar.java').asFile
        target.parentFile.mkdirs()
        target.text = source.text.replace('android.icu.util.', 'com.ibm.icu.util.')
                .replace('PinnedCalendar', 'JvmPinnedCalendar')
    }
}
android.sourceSets.test.java.srcDir(calendarAdapterOutput)
// Lint models and analysis read these generated test sources too.
tasks.configureEach {
    if (name.contains('UnitTest')) dependsOn(generateJvmCalendarAdapter)
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.ibm.icu:icu4j:78.1'
}
