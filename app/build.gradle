plugins {
    id 'com.android.application'
}

def localizationResourceFiles = [
        'values', 'values-ar', 'values-de', 'values-en', 'values-es', 'values-fa',
        'values-fr', 'values-hi', 'values-ja', 'values-pt', 'values-ru', 'values-tr',
        'values-zh-rCN'
].collect { file("src/main/res/${it}/strings.xml") }

// Every locale is maintained in one strings.xml file. Keep this compatibility task so old
// Android Studio run configurations can verify the central locale files.
tasks.register('generateLocalizations') {
    group = 'build setup'
    description = 'Verifies the localization XML files committed under src/main/res.'
    inputs.files(localizationResourceFiles)
    doLast {
        def missingFiles = localizationResourceFiles.findAll { !it.isFile() }
        if (!missingFiles.isEmpty()) {
            throw new GradleException('Missing committed localization resources: '
                    + missingFiles.join(', '))
        }
        logger.lifecycle('All committed localization resources are present.')
    }
}

android {
    namespace 'com.ilia.advanceclock'

    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.ilia.advanceclock'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateLocalizations')
}

// Exercise the production adapter on JVM ICU without executing Android stub methods.
// Only the ICU import and class name differ; the adapter logic is generated verbatim.
def calendarAdapterOutput = layout.buildDirectory.dir('generated/calendarTest')
def generateJvmCalendarAdapter = tasks.register('generateJvmCalendarAdapter') {
    def source = file('src/main/java/com/ilia/advanceclock/PinnedCalendar.java')
    inputs.file(source)
    outputs.dir(calendarAdapterOutput)
    doLast {
        def target = calendarAdapterOutput.get().file('com/ilia/advanceclock/JvmPinnedCalendar.java').asFile
        target.parentFile.mkdirs()
        target.text = source.text.replace('android.icu.util.', 'com.ibm.icu.util.')
                .replace('PinnedCalendar', 'JvmPinnedCalendar')
    }
}
android.sourceSets.test.java.srcDir(calendarAdapterOutput)
tasks.withType(JavaCompile).configureEach {
    if (name.contains('UnitTest')) dependsOn(generateJvmCalendarAdapter)
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.ibm.icu:icu4j:78.1'
}

// Keep the Play Store filename outside res (Android resource names cannot contain '-').
// Accept the original image in app/ or the repository root; never edit build/generated.
def launcherIconCandidates = [
        layout.projectDirectory.file('ic_launcher-playstore.png').asFile,
        rootProject.layout.projectDirectory.file('ic_launcher-playstore.png').asFile
]
// File trees contain only existing files: missing candidates must reach our helpful error,
// rather than Gradle's input_file_does_not_exist validation.
def launcherIconInputs = files(
        fileTree(projectDir) { include 'ic_launcher-playstore.png' },
        fileTree(rootProject.projectDir) { include 'ic_launcher-playstore.png' }
)
def launcherIconResources = layout.buildDirectory.dir('generated/res/launcherIcon')
def generateLauncherIcon = tasks.register('generateLauncherIcon') {
    inputs.files(launcherIconInputs)
    outputs.dir(launcherIconResources)
    doLast {
        def source = launcherIconCandidates.find { it.isFile() }
        if (source == null) {
            throw new GradleException('Launcher image missing. Place ic_launcher-playstore.png in the project root (beside settings.gradle) or in app/, then build again.')
        }
        copy {
            from(source)
            into(launcherIconResources.get().dir('drawable-nodpi'))
            rename { 'ic_launcher_playstore.png' }
        }
    }
}
android.sourceSets.main.res.srcDir(launcherIconResources)
tasks.named('preBuild').configure {
    dependsOn(generateLauncherIcon)
}
